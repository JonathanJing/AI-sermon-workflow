version: '3.8'

services:
  sermon-workflow:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./app/config:/app/app/config:ro  # Mount config directory for phrase management
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - DEBUG=false
      - STORAGE_TYPE=local
      - STT_LANGUAGE_CODE=cmn-Hans-CN
      - STT_MODEL=default
      - STT_COST_LIMIT_USD=10.0
      - MAX_FILE_SIZE_MB=500
      - MAX_PROCESSING_TIME_SECONDS=3600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - default
      - redis

  # Redis service for task queue (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - redis

  # Optional: Add a simple web interface for monitoring
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - admin

volumes:
  redis_data:

networks:
  default:
    driver: bridge 